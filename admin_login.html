<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" href="./images/logoretro.png" type="image/x-icon">
  <title>Admin Login - The Retro Rack</title>
  <link rel="stylesheet" href="./css/styles.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    body {
      background: #f4f1ea;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .admin-login-box {
      width: 100%;
      max-width: 440px;
      background: #fff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.06);
      border: 1px solid #e0ded7;
      text-align: center;
    }
    .admin-login-box img {
      width: 64px;
      margin-bottom: 12px;
    }
    .admin-form-group {
      text-align: left;
      margin-bottom: 14px;
    }
    .admin-form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 5px;
    }
    .admin-form-group input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="admin-login-box">
    <img src="./images/logoretro.png" alt="The Retro Rack" />
    <h1 style="font-size: 1.6rem; color: #1e1e24; margin-bottom: 6px;">The Retro Rack</h1>
    <p style="font-size: 13px; color: #777; margin-bottom: 1.5rem;">Store Administration & Management Portal</p>

    <div style="background: rgba(255, 119, 0, 0.08); border: 1px solid rgba(255, 119, 0, 0.3); padding: 12px; border-radius: 6px; margin-bottom: 1.5rem; text-align: left;">
      <span style="font-size: 12px; font-weight: 700; color: var(--orange); display: block; margin-bottom: 4px;">⚡ Portfolio 1-Click Access</span>
      <p style="font-size: 12px; color: #555; margin-bottom: 8px;">Jump straight into the Admin Dashboard to test store management features:</p>
      <button type="button" id="oneClickAdmin" class="btn" style="width: 100%; background: var(--orange); color: #fff; font-weight: 700; padding: 10px; cursor: pointer;">
        ⚡ Enter Admin Dashboard (1-Click)
      </button>
    </div>

    <form id="admin-login-form">
      <div class="admin-form-group">
        <label>Admin Username</label>
        <input type="text" id="adm-user" value="admin" required />
      </div>
      <div class="admin-form-group">
        <label>Password</label>
        <input type="password" id="adm-pass" value="password123" required />
      </div>

      <button type="submit" class="btn" style="width: 100%; padding: 12px; background: #222; color: #fff; font-weight: 600; cursor: pointer;">
        Sign In
      </button>
    </form>

    <div style="margin-top: 1.5rem;">
      <a href="index.html" style="font-size: 13px; color: #777; text-decoration: underline;">← Return to Customer Storefront</a>
    </div>
  </div>

  <script src="./js/retroStore.js"></script>
  <script src="./js/demoBadge.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      document.getElementById('oneClickAdmin').addEventListener('click', function () {
        if (window.RetroStore) window.RetroStore.loginAsAdmin();
        window.location.href = 'admin_dashboard.html';
      });

      document.getElementById('admin-login-form').addEventListener('submit', function (e) {
        e.preventDefault();
        if (window.RetroStore) window.RetroStore.loginAsAdmin();
        window.location.href = 'admin_dashboard.html';
      });
    });
  </script>
</body>
</html>
